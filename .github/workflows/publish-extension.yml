name: Publish Extension

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Package without publishing'
        type: boolean
        default: false

concurrency:
  group: publish-extension
  cancel-in-progress: false

jobs:
  publish:
    # Aggressive mbrother rollout: migrated to local beefy Podman self-hosted runner (logan-laptop)
    # Replaces ubuntu-latest for the release/publish job (VS Code Marketplace + Open VSX).
    # Uses master branch + complex multi-package npm ci + builds (per CLAUDE.md).
    # New labels + clear fallback comment.
    runs-on: [self-hosted, linux, x64, podman, logan-laptop, beefy]
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webview-ui/package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install webview dependencies
        run: npm ci
        working-directory: webview-ui

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Check types and lint
        run: npm run check-types && npm run lint

      - name: Publish to VS Code Marketplace
        id: publish-vscode
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.VSCE_PAT }}
          registryUrl: https://marketplace.visualstudio.com
          skipDuplicate: true
          dryRun: ${{ inputs.dry_run == 'true' }}

      - name: Publish to Open VSX
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.OPEN_VSX_TOKEN }}
          registryUrl: https://open-vsx.org
          extensionFile: ${{ steps.publish-vscode.outputs.vsixPath }}
          skipDuplicate: true
          dryRun: ${{ inputs.dry_run == 'true' }}

      - name: Upload VSIX to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.publish-vscode.outputs.vsixPath }}
